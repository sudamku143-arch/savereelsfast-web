<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>SaveReelsFast — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box; text-align: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #f4f4f5; background: #09090b radial-gradient(60rem 30rem at 50% -10%, rgba(225, 48, 108, 0.18), transparent 70%);
      }
      main { max-width: 22rem; }
      img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 0 24px -4px rgba(225, 48, 108, 0.65); }
      h1 { margin: 20px 0 8px; font-size: 1.4rem; }
      p { margin: 0 0 24px; color: #a1a1aa; }
      button {
        border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600; color: #fff;
        background: #e1306c; box-shadow: 0 0 24px -4px rgba(225, 48, 108, 0.65); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1 id="title">You're offline</h1>
      <p id="text">SaveReelsFast needs an internet connection to fetch videos. Reconnect and try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var copy = {
        es: ["Sin conexión", "SaveReelsFast necesita internet para obtener videos. Vuelve a conectarte e inténtalo de nuevo.", "Reintentar"],
        pt: ["Você está offline", "O SaveReelsFast precisa de internet para buscar vídeos. Reconecte-se e tente novamente.", "Tentar novamente"],
      };
      var lang = (navigator.language || "en").slice(0, 2);
      if (copy[lang]) {
        document.documentElement.lang = lang;
        document.getElementById("title").textContent = copy[lang][0];
        document.getElementById("text").textContent = copy[lang][1];
        document.getElementById("retry").textContent = copy[lang][2];
      }
      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
